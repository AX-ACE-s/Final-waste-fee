<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>대형폐기물 배출 전 체크리스트 | 서울특별시</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<style>
:root {
  --bg: #FFFFFF;
  --card: #F6F6F6;
  --ink: #111111;
  --sub: #6E6E6E;
  --faint: #ABABAB;
  --line: #E0E0E0;
  --on-ink: #FFFFFF;
  --key: #1f6f5c; /* 통합: 전체 화면 초록(#1f6f5c)에 맞춤. 원본 #0B8A4B */
  --on-key: #FFFFFF;
  --font: "Pretendard Variable", Pretendard, -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", "Malgun Gothic", "맑은 고딕", sans-serif;
  box-sizing: border-box;
  padding-top: env(safe-area-inset-top, 0px); padding-bottom: env(safe-area-inset-bottom, 0px);
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    color-scheme: dark;
    --bg: #0C0C0C; --card: #1A1A1A; --ink: #F5F5F5; --sub: #A3A3A3; --faint: #6B6B6B; --line: #303030; --on-ink: #0C0C0C;
    --key: #34C77B; --on-key: #06210F;
  }
}
:root[data-theme="dark"] {
  color-scheme: dark;
  --bg: #0C0C0C; --card: #1A1A1A; --ink: #F5F5F5; --sub: #A3A3A3; --faint: #6B6B6B; --line: #303030; --on-ink: #0C0C0C;
  --key: #34C77B; --on-key: #06210F;
}
* { box-sizing: border-box; }
body {
  margin: 0; background: var(--bg); color: var(--ink);
  font-family: var(--font); font-size: 16px; line-height: 1.55;
  -webkit-font-smoothing: antialiased; word-break: keep-all;
}
button, input, select { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 2px solid var(--ink); outline-offset: 3px; }
[hidden] { display: none !important; }
.wrap { max-width: 1200px; margin: 0 auto; padding: 0 40px; }
@media (max-width: 700px) { .wrap { padding: 0 20px; } }

/* 머리줄 */
.top { border-bottom: 1px solid var(--line); }
/* 상단바: 수수료 확인 페이지와 같은 모양 (통합하면서 바꿈) */
.top { position: sticky; top: 0; z-index: 20; background: var(--bg); }
.top .wrap { height: 64px; display: flex; align-items: center; gap: 36px; }
.brand { font-weight: 700; font-size: 1.0625rem; letter-spacing: -0.01em; color: var(--ink); text-decoration: none; white-space: nowrap; }
.gnb { display: flex; gap: 6px; height: 100%; }
.gnb a { display: flex; align-items: center; padding: 0 14px; height: 100%; color: var(--sub); font-weight: 600; text-decoration: none; border-bottom: 2px solid transparent; margin-bottom: -1px; }
.gnb a:hover { color: var(--ink); }
.gnb a[aria-current="page"] { color: var(--ink); border-bottom-color: var(--ink); }
.scope { margin-left: auto; color: var(--sub); font-size: 0.875rem; white-space: nowrap; }
@media (max-width: 700px) { .top .wrap { gap: 12px; } .brand, .scope { display: none; } .gnb a { padding: 0 8px; } }

/* 고르기 */
.pick { display: grid; grid-template-columns: minmax(0, 1.25fr) minmax(0, 1fr); gap: 72px; padding-top: 72px; align-items: end; }
.ask { font-size: clamp(2rem, 3.6vw, 2.75rem); font-weight: 700; line-height: 1.3; letter-spacing: -0.025em; margin: 0; }
.search { display: flex; align-items: center; gap: 10px; margin-top: 28px; border-bottom: 2px solid var(--line); padding: 6px 0 12px; }
.search:focus-within { border-color: var(--ink); }
.search input { flex: 1; min-width: 0; border: 0; background: none; font-size: 1.375rem; padding: 0; outline: none; }
.search input::placeholder { color: var(--faint); }
.search input::-webkit-search-cancel-button { display: none; }
.search svg { flex: none; color: var(--faint); }

.where { display: grid; grid-template-columns: auto 1fr; gap: 14px 20px; align-items: center; padding-bottom: 6px; }
.where .name { font-weight: 600; color: var(--sub); font-size: 0.9375rem; }
.where .set { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
.pill {
  display: inline-flex; align-items: center; gap: 6px; height: 42px; padding: 0 16px;
  background: var(--card); border: 0; border-radius: 10px; font-size: 0.9375rem; font-weight: 500;
}
.pill svg { flex: none; }
.pill select { border: 0; background: none; padding: 0 2px 0 0; font-weight: 600; outline: none; cursor: pointer; }
.pill:focus-within { outline: 2px solid var(--ink); outline-offset: 3px; }
.pill.on { background: var(--key); color: var(--on-key); font-weight: 600; }
.pill.need { box-shadow: inset 0 0 0 2px var(--ink); }
.notice { margin: 0; font-size: 0.9375rem; font-weight: 600; }

.tabs { display: flex; gap: 4px; margin-top: 56px; }
.tab { height: 42px; padding: 0 20px; border-radius: 999px; border: 1.5px solid transparent; background: none; font-weight: 600; color: var(--sub); }
.tab:hover { color: var(--ink); }
.tab[aria-selected="true"] { border-color: var(--ink); color: var(--ink); font-weight: 700; }
.chips { display: flex; flex-wrap: wrap; gap: 10px; margin-top: 20px; }
.chip { height: 44px; padding: 0 20px; border-radius: 999px; border: 1px solid var(--line); background: var(--bg); color: var(--sub); }
.chip:hover { border-color: var(--ink); color: var(--ink); }
.chip[aria-pressed="true"] { background: var(--key); border-color: var(--key); color: var(--on-key); font-weight: 600; }
.none { color: var(--sub); margin: 20px 0 0; }

/* 확인 목록 */
.result { margin-top: 72px; padding: 56px 0 96px; border-top: 1px solid var(--line); scroll-margin-top: 16px; }
.empty { margin: 0; padding: 72px 24px; text-align: center; color: var(--sub); background: var(--card); border-radius: 20px; }
.head { display: block; }
.title { font-size: clamp(1.625rem, 2.6vw, 2.125rem); font-weight: 700; line-height: 1.3; letter-spacing: -0.02em; margin: 0; }
.count { margin: 10px 0 0; color: var(--sub); }
.bar { height: 6px; background: var(--card); border-radius: 3px; margin-top: 14px; overflow: hidden; }
.bar i { display: block; height: 100%; width: 0; background: var(--key); border-radius: 3px; transition: width .25s ease; }
@media (prefers-reduced-motion: reduce) { .bar i { transition: none; } }
.go { max-width: 520px; margin: 48px auto 0; text-align: center; }
.go .left { margin: 0 0 10px; font-size: 0.9375rem; font-weight: 600; }
.apply { display: block; text-align: center; text-decoration: none; height: 56px; line-height: 56px; border-radius: 14px; background: var(--key); color: var(--on-key); font-weight: 700; }
.apply.waiting { background: var(--card); color: var(--ink); }
.go .hint { margin: 8px 0 0; color: var(--sub); font-size: 0.8125rem; }

.cards { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 20px; margin-top: 40px; align-items: start; }
.card { background: var(--card); border-radius: 20px; padding: 24px 22px 8px; }
.card h2 { font-size: 1.0625rem; font-weight: 700; margin: 0 0 6px; display: flex; align-items: center; gap: 10px; }
.card h2 .num { width: 24px; height: 24px; border-radius: 50%; background: var(--key); color: var(--on-key); font-size: 0.8125rem; display: grid; place-items: center; flex: none; }
.check { display: grid; grid-template-columns: 24px 1fr; gap: 2px 12px; padding: 15px 0; border-top: 1px solid var(--line); cursor: pointer; }
.card h2 + .check { border-top: 0; }
.check input {
  appearance: none; -webkit-appearance: none; width: 24px; height: 24px; margin: 0; cursor: pointer;
  border: 1.5px solid var(--faint); border-radius: 50%; background: var(--bg); display: grid; place-items: center;
}
.check:hover input { border-color: var(--key); }
.check input::after { content: ""; width: 10px; height: 5px; margin-top: -3px; border-left: 2px solid var(--on-key); border-bottom: 2px solid var(--on-key); transform: rotate(-45deg); opacity: 0; }
.check input:checked { background: var(--key); border-color: var(--key); }
.check input:checked::after { opacity: 1; }
.check .text { font-weight: 600; }
.check .why { grid-column: 2; color: var(--sub); font-size: 0.875rem; }
.check .local { grid-column: 2; justify-self: start; margin-top: 6px; font-size: 0.8125rem; padding: 3px 10px; border-radius: 999px; }
.check .local.known { background: var(--key); color: var(--on-key); }
.check .local.unknown { border: 1px solid var(--faint); color: var(--sub); background: var(--bg); }
.check:has(input:checked) .text { color: var(--faint); font-weight: 500; }
.check:has(input:checked) .why, .check:has(input:checked) .local { display: none; }
.basis { margin: 32px 0 0; color: var(--faint); font-size: 0.8125rem; text-align: center; }
.basis a { color: inherit; }
.error { margin: 0; padding: 16px 18px; border: 1.5px solid var(--ink); border-radius: 12px; font-weight: 600; }

@media (max-width: 960px) {
  .pick { grid-template-columns: 1fr; gap: 32px; padding-top: 48px; }
  .cards { grid-template-columns: 1fr; gap: 16px; }
  .tabs { margin-top: 40px; }
  .result { margin-top: 48px; padding-top: 40px; }
}
</style>
</head>
<body>
<header class="top">
  <div class="wrap">
    <a class="brand" href="/">우리동네 대형폐기물</a>
    <nav class="gnb" aria-label="주요 메뉴">
      <a href="/" id="feeLink">수수료 확인</a>
      <a href="/checklist/" aria-current="page">배출 전 체크리스트</a>
    </nav>
    <span class="scope">서울특별시 25개 자치구</span>
  </div>
</header>

<main class="wrap">
  <section class="pick">
    <div>
      <h1 class="ask">어떤 물건을<br>버리시나요?</h1>
      <label class="search">
        <input id="q" type="search" placeholder="버릴 물건을 검색하세요" autocomplete="off" aria-label="버릴 물건 검색">
        <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="M16.5 16.5 21 21"/></svg>
      </label>
    </div>
    <div class="where">
      <span class="name">버리는 곳</span>
      <div class="set">
        <label class="pill" id="districtPill">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M12 21s7-6.2 7-11a7 7 0 1 0-14 0c0 4.8 7 11 7 11Z"/><circle cx="12" cy="10" r="2.5"/></svg>
          <select id="district" aria-label="버리는 자치구"><option value="">자치구 선택</option></select>
        </label>
        <p class="notice" id="notice" hidden>먼저 자치구를 골라 주세요.</p>
      </div>
      <span class="name">사는 곳</span>
      <div class="set" id="housing"></div>
    </div>
  </section>

  <div class="tabs" id="tabs" role="tablist" aria-label="물건 종류"></div>
  <p class="none" id="none" hidden>찾는 물건이 목록에 없습니다. 아래 ‘그 밖의 물건’을 누르면 모든 물건에 공통인 확인 목록이 나옵니다.</p>
  <div class="chips" id="items"></div>

  <section class="result" id="result" aria-live="polite">
    <p class="empty">자치구와 버릴 물건을 고르면 여기에 확인 목록이 나옵니다.</p>
  </section>
</main>
<script>
  // 통합: '수수료 확인'을 누르면 보던 단계(#result 등)로 돌아간다
  try { const h = sessionStorage.getItem('waste-fee-hash'); if (h) document.getElementById('feeLink').href = '/' + h; } catch (e) {}
</script>
<script src="/checklist/static/app.js"></script>
</body>
</html>
